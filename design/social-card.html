<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Pixelify'; src: url('../game/fonts/PixelifySans.ttf'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1b1533; }
  .bg { position: absolute; inset: 0; background: url('../game/assets/bg/title.jpg') center / cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,11,28,0.15) 0%, rgba(14,11,28,0) 40%, rgba(14,11,28,0.55) 100%); }
  h1 { position: absolute; top: 50px; width: 100%; text-align: center; margin: 0; font: 150px 'Pixelify'; color: #ffd25e;
       text-shadow: 0 0 24px rgba(240,138,36,0.9), 6px 6px 0 #140f24; }
  p { position: absolute; top: 225px; width: 100%; text-align: center; margin: 0; font: 40px 'Pixelify'; color: #f2ead8; text-shadow: 3px 3px 0 #140f24; }
  .url { position: absolute; top: 284px; width: 100%; text-align: center; font: 26px 'Pixelify'; color: #ffd25e; text-shadow: 2px 2px 0 #140f24; letter-spacing: 1px; }
  .kids { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 22px; }
  .kids img { height: 150px; image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.35)); }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <h1>Porchlight</h1>
  <p>Match the costume. Light the jack.</p>
  <div class="url">porchlight.synapticnoise.com</div>
  <div class="kids">
    <img src="../game/assets/sprites/costumes/critter-black.png">
    <img src="../game/assets/sprites/costumes/magic-purple.png">
    <img src="../game/assets/sprites/costumes/spooky-white.png">
    <img src="../game/assets/sprites/costumes/snack-orange.png">
    <img src="../game/assets/sprites/costumes/hero-red.png">
    <img src="../game/assets/sprites/costumes/critter-pink.png">
    <img src="../game/assets/sprites/costumes/spooky-black.png">
  </div>
</body></html>
