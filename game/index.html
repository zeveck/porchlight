<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porchlight: a Halloween costume puzzle game</title>
<meta name="description" content="Trick-or-treat across a sprawling pixel-art town. Work out which of 50 costumes each house loves, bribe other kids to swap outfits, and light every jack-o'-lantern on the block.">
<link rel="canonical" href="https://porchlight.synapticnoise.com/">
<meta name="theme-color" content="#1b1533">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:url" content="https://porchlight.synapticnoise.com/">
<meta property="og:title" content="Porchlight">
<meta property="og:description" content="Match the costume. Light the jack. A cozy Halloween puzzle game with 50 costumes to collect.">
<meta property="og:image" content="https://porchlight.synapticnoise.com/social-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Porchlight title art: costumed kids on a moonlit street full of glowing jack-o'-lanterns">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Porchlight">
<meta name="twitter:description" content="Match the costume. Light the jack. A cozy Halloween puzzle game with 50 costumes to collect.">
<meta name="twitter:image" content="https://porchlight.synapticnoise.com/social-card.jpg">
<meta name="twitter:image:alt" content="Porchlight title art: costumed kids on a moonlit street full of glowing jack-o'-lanterns">
<style>
  @font-face { font-family: 'Pixelify'; src: url('fonts/PixelifySans.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #0e0b1c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; image-rendering: pixelated; touch-action: none; outline: none; }
  #safe { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); pointer-events: none; visibility: hidden; }
  #safe > div { width: 100%; height: 100%; }
  #touch { display: none; }
  body.touch.playing #touch { display: block; }
  body.dialog #touch { display: none; }
  .tbtn { position: fixed; border-radius: 50%; border: 3px solid rgba(255, 210, 94, .75); background: rgba(27, 21, 51, .55); color: #ffd25e; font: 22px 'Pixelify', sans-serif; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .tbtn.down { background: rgba(240, 138, 36, .6); }
  #btnA { width: 78px; height: 78px; right: calc(env(safe-area-inset-right) + 20px); bottom: calc(env(safe-area-inset-bottom) + 22px); font-size: 30px; }
  #btnB { width: 64px; height: 64px; right: calc(env(safe-area-inset-right) + 108px); bottom: calc(env(safe-area-inset-bottom) + 70px); font-size: 15px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffd25e; font: 20px 'Pixelify', sans-serif; }
  .tlink { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 10px); display: none; padding: 4px 6px; font: 13px 'Pixelify', sans-serif; color: #b0a8c8; text-decoration: none; text-shadow: 0 1px 2px rgba(14, 11, 28, .9); opacity: .7; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body.title .tlink { display: block; }
  .tlink:focus-visible { opacity: 1; color: #ffd25e; text-decoration: underline; outline: none; }
  @media (hover: hover) { .tlink:hover { opacity: 1; color: #ffd25e; text-decoration: underline; } }
  #linkSite { left: calc(env(safe-area-inset-left) + 12px); }
  #linkGit { right: calc(env(safe-area-inset-right) + 12px); }
  @media (pointer: coarse), (max-width: 600px) { .tlink { font-size: 11px; padding: 6px; } }
  /* narrow screens: sit just above the progress bar at the bottom of the title */
  @media (max-width: 600px) { .tlink { bottom: calc(env(safe-area-inset-bottom) + 40px); } }
  /* the bug-report form: typing and touch work inside it */
  gh-feedback { -webkit-user-select: text; user-select: text; touch-action: auto; -webkit-touch-callout: default;
    --gh-feedback-bg: #1b1533; --gh-feedback-text: #f2ead8; --gh-feedback-border: #5a4a80; --gh-feedback-input-bg: #140f24; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="safe"><div id="safeInner"></div></div>
<div id="touch">
  <div class="tbtn" id="btnB">PWR</div>
  <div class="tbtn" id="btnA">A</div>
</div>
<div id="loading">Carving pumpkins…</div>
<a class="tlink" id="linkSite" href="https://synapticnoise.com/">synapticnoise.com</a>
<a class="tlink" id="linkGit" href="https://github.com/zeveck/porchlight" target="_blank" rel="noopener" title="Porchlight on GitHub: how it was made" aria-label="Porchlight on GitHub: how it was made">GitHub</a>
<script>
  // Ctrl+Shift+F opens the bug report from anywhere, even if the game itself is stuck.
  addEventListener('keydown', (e) => {
    if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.key.toLowerCase() !== 'f') return;
    const fb = document.getElementById('report');
    if (!fb?.getAttribute('repo') || document.activeElement === fb) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    try { window.reportShortcut?.(); } catch {}
    fb.open();
  }, true);
</script>
<script type="module" src="src/main.js"></script>
<script type="module" src="vendor/gh-feedback.js"></script>
<gh-feedback id="report" trigger="none" repo="zeveck/porchlight" template="bug.yml"
  types="bug,feature" theme="dark" color="#f08a24" popup-color="#f08a24"></gh-feedback>
</body>
</html>
